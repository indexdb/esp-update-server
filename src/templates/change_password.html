{% extends "layout.html" %}
{% block body %}
<h2>Change Password</h2>

<div style="background: #e3f2fd; padding: 15px; border-radius: 4px; margin-bottom: 20px; border-left: 4px solid #2196f3;">
  <p style="margin: 0; color: #1976d2;">
    <strong>Current user:</strong> {{ session.username }}<br>
    Please change your password regularly for security. Password must be at least 4 characters.
  </p>
</div>

<form method="POST" action="{{ url_for('change_password') }}" style="max-width: 500px;">
  <div style="margin-bottom: 20px;">
    <label for="current_password" style="display: block; margin-bottom: 5px; font-weight: 500;">Current Password *</label>
    <input type="password" id="current_password" name="current_password" required autofocus
           style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
  </div>
  
  <div style="margin-bottom: 20px;">
    <label for="new_password" style="display: block; margin-bottom: 5px; font-weight: 500;">New Password *</label>
    <input type="password" id="new_password" name="new_password" required
           style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
    <small style="color: #666; font-size: 12px;">At least 4 characters</small>
  </div>
  
  <div style="margin-bottom: 20px;">
    <label for="confirm_password" style="display: block; margin-bottom: 5px; font-weight: 500;">Confirm New Password *</label>
    <input type="password" id="confirm_password" name="confirm_password" required
           style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
  </div>
  
  <button type="submit" style="padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: 600;">
    Change Password
  </button>
  <a href="{{ url_for('index') }}" style="margin-left: 10px; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">
    Cancel
  </a>
</form>

{% endblock %}
